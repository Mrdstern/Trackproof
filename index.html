<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrackProof</title>
<style>
:root{--bg:#070b14;--panel:#0d1424;--panel2:#111a2e;--text:#f5f7fb;--muted:#9fb0cc;--blue:#2f6bff;--blue2:#173d99;--gold:#c8a45b;--line:#21304d;--ok:#3ecf8e;--warn:#f0b35a;--bad:#ef6a6a}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#060a12 0%,#0a1020 100%);color:var(--text)}
button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 18px;background:rgba(7,11,20,.92);position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:24px}.sub{color:var(--muted);font-size:12px;line-height:1.4;margin-top:6px}.nav{margin-top:28px;display:grid;gap:8px}.nav button{background:transparent;color:var(--muted);border:0;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.main{padding:28px;max-width:1200px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.title{font-size:30px;font-weight:800}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,var(--panel),#0a1220);border:1px solid var(--line);border-radius:16px;padding:18px}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:30px;font-weight:800}.label{color:var(--muted);font-size:13px}.progress{height:10px;background:#0a0f1b;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),#6d8cff)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#17130a}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:#09111f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tracklist{display:grid;gap:10px}.track{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0a1220;display:flex;justify-content:space-between;gap:12px;align-items:center}.track strong{display:block}.muted{color:var(--muted)}.hidden{display:none!important}.section-title{font-size:18px;font-weight:700;margin-bottom:12px}.checklist{display:grid;gap:10px}.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0a1220}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:14px}.shot{border:1px dashed #35517f;border-radius:12px;padding:14px;min-height:120px;background:#08101e}.shot img{max-width:100%;border-radius:10px;margin-top:8px}.small{font-size:12px}.footer-note{margin-top:24px;color:var(--muted);font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.main{padding:18px}.span4,.span6,.span8,.span12{grid-column:span 12}.fields2,.fields3,.evidence{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">TrackProof</div>
  <div class="sub">Album evidence, release prep, and provenance in one place.</div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top"><div><div class="title" id="pageTitle">Dashboard</div><div class="muted" id="albumLine"></div></div><div class="pill" id="saveState">Local autosave</div></div>
  <section id="dashboard" class="view"></section>
  <section id="tracks" class="view hidden"></section>
  <section id="evidence" class="view hidden"></section>
  <section id="release" class="view hidden"></section>
  <section id="direct" class="view hidden"></section>
  <section id="export" class="view hidden"></section>
</main>
</div>
<script>
const seedTitles=[
['Sound of Your Voice','2:56'],['Coast','3:01'],['Fine Times','2:16'],['Flicker','2:22'],['Unshakable (Remastered)','2:14'],['Clarity on the Horizon','3:59'],['Train to Kyoto','1:54'],['Mental Holiday','2:08'],['Confetti Rose','3:21'],['Come Up','2:05'],['Catching Greatness','2:06'],['Making Room','3:07'],['Maybe Today','3:46'],['Our Journey Together (Cover)','2:33'],['Surreal','2:03'],['Dream Beat (Remastered) (Cover)','2:18'],['Come Forth (Remastered)','2:59'],['SayLess Love (Remastered)','3:58'],['L2i6','3:36'],['Vibin','3:40'],['Acclaim','4:17']
];
const defaultState={album:{title:'Lofi Allure',artist:'ACKNWDGE',distributor:'UnitedMasters',theme:'Instrumental ambient lofi',status:'Draft',backwards:true},tracks:seedTitles.map((x,i)=>({number:i+1,title:x[0],filename:(x[0]+'.mp3'),duration:x[1],instrumental:true,style:'',created:'',version:'',sunoUrl:'',notes:'',canvaShot:'',sunoShot:'',ready:false})),release:{},direct:{}};
let state=JSON.parse(localStorage.getItem('trackproof-state')||'null')||defaultState;
const navItems=[['dashboard','Dashboard'],['tracks','Tracks'],['evidence','Evidence'],['release','Release Prep'],['direct','Direct Sale'],['export','Export']];
const nav=document.getElementById('nav'); navItems.forEach(([id,label],i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;if(i===0)b.classList.add('active');b.onclick=()=>showView(id,label,b);nav.appendChild(b)});
function showView(id,label,b){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('pageTitle').textContent=label;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderAll()}
function save(){localStorage.setItem('trackproof-state',JSON.stringify(state));document.getElementById('saveState').textContent='Saved locally';setTimeout(()=>document.getElementById('saveState').textContent='Local autosave',1000)}
function sec(d){const [m,s]=d.split(':').map(Number);return m*60+s} function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function completeness(t){let n=0,total=5;if(t.duration)n++;if(t.created)n++;if(t.sunoUrl)n++;if(t.canvaShot)n++;if(t.sunoShot)n++;return Math.round(n/total*100)}
function flags(t){const f=[];if(!t.sunoUrl)f.push('Missing Suno link');if(!t.sunoShot)f.push('Missing Suno screenshot');if(!t.canvaShot)f.push('Missing Canva screenshot');if(!t.created)f.push('Missing creation date');if(/cover/i.test(t.title))f.push('Cover label review');return f}
function renderDashboard(){const total=state.tracks.reduce((a,t)=>a+sec(t.duration),0);const avg=Math.round(state.tracks.reduce((a,t)=>a+completeness(t),0)/state.tracks.length);const missing=state.tracks.reduce((a,t)=>a+flags(t).length,0);document.getElementById('dashboard').innerHTML=`<div class="grid">
<div class="card span4"><div class="label">Album runtime</div><div class="metric">${fmt(total)}</div></div>
<div class="card span4"><div class="label">Evidence completion</div><div class="metric">${avg}%</div><div class="progress"><div style="width:${avg}%"></div></div></div>
<div class="card span4"><div class="label">Open flags</div><div class="metric">${missing}</div></div>
<div class="card span8"><div class="section-title">Album overview</div><div class="fields2">
<div class="field"><label>Album title</label><input value="${esc(state.album.title)}" oninput="state.album.title=this.value;save();renderAll()"></div>
<div class="field"><label>Artist</label><input value="${esc(state.album.artist)}" oninput="state.album.artist=this.value;save();renderAll()"></div>
<div class="field"><label>Distributor</label><input value="${esc(state.album.distributor)}" oninput="state.album.distributor=this.value;save()"></div>
<div class="field"><label>Theme / genre</label><input value="${esc(state.album.theme)}" oninput="state.album.theme=this.value;save()"></div>
</div></div>
<div class="card span4"><div class="section-title">Workflow</div><div class="check"><input type="checkbox" ${state.album.backwards?'checked':''} onchange="state.album.backwards=this.checked;save();renderAll()"><div><strong>Backwards Mode</strong><div class="small muted">Next Track moves to the previous track number.</div></div></div></div>
<div class="card span12"><div class="section-title">Track status</div>${state.tracks.map(t=>`<div class="track"><div><strong>#${t.number} ${esc(t.title)}</strong><div class="small muted">${t.duration} · ${completeness(t)}% complete</div></div><div>${flags(t).length?`<span class="badge warn">${flags(t).length} flags</span>`:`<span class="badge ok">Ready</span>`}</div></div>`).join('')}</div>
</div>`}
function renderTracks(){document.getElementById('tracks').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="section-title">Track catalog</div><div class="muted small">Edit metadata. Track numbers remain stable.</div></div><button class="btn secondary" onclick="addTrack()">Add Track</button></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Title</th><th>Duration</th><th>Filename</th><th>Status</th></tr></thead><tbody>${state.tracks.map(t=>`<tr><td>${t.number}</td><td><input value="${esc(t.title)}" oninput="u(${t.number},'title',this.value)"></td><td><input value="${esc(t.duration)}" oninput="u(${t.number},'duration',this.value)" style="width:80px"></td><td><input value="${esc(t.filename)}" oninput="u(${t.number},'filename',this.value)"></td><td>${flags(t).length?`<span class="badge warn">Review</span>`:`<span class="badge ok">Ready</span>`}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderEvidence(){document.getElementById('evidence').innerHTML=`<div class="card"><div class="section-title">Evidence review</div><div class="muted small" style="margin-bottom:14px">Upload or reference screenshots per track, then confirm the metadata beside them. No external OCR/API is required in this MVP.</div>${state.tracks.map(t=>`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><strong>#${t.number} ${esc(t.title)}</strong><div class="small muted">${t.duration}</div></div><div>${flags(t).map(f=>`<span class="badge warn" style="margin-left:4px">${esc(f)}</span>`).join('')}</div></div><div class="evidence" style="margin-top:12px"><div><div class="shot"><strong>Canva timeline evidence</strong><input type="file" accept="image/*" onchange="imgUpload(${t.number},'canvaShot',this)">${t.canvaShot?`<img src="${t.canvaShot}">`:''}</div></div><div><div class="shot"><strong>Suno detail evidence</strong><input type="file" accept="image/*" onchange="imgUpload(${t.number},'sunoShot',this)">${t.sunoShot?`<img src="${t.sunoShot}">`:''}</div></div></div><div class="fields3" style="margin-top:12px"><div class="field"><label>Created</label><input value="${esc(t.created)}" oninput="u(${t.number},'created',this.value)"></div><div class="field"><label>Suno version</label><input value="${esc(t.version)}" oninput="u(${t.number},'version',this.value)"></div><div class="field"><label>Suno URL</label><input value="${esc(t.sunoUrl)}" oninput="u(${t.number},'sunoUrl',this.value)"></div></div><div class="field" style="margin-top:12px"><label>Style description</label><textarea rows="2" oninput="u(${t.number},'style',this.value)">${esc(t.style)}</textarea></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="nextTrack(${t.number})">Next Track</button></div></div>`).join('')}</div>`}
const releaseItems=['Confirm final album title styling','Confirm primary artist','Confirm final track order','Prepare distribution-ready WAV masters','Confirm cover artwork','Confirm writers/composers','Confirm genre/subgenre','Confirm explicit status','Add release date','Add ISRCs','Add UPC','Review publishing / PRO / MLC / copyright status','Review AI tool commercial-use rights','Review YouTube / Content ID behavior'];
const directItems=['Prepare customer-ready audio files','Prepare album artwork and product mockup','Write license / personal-use terms','Add complete tracklist','Add total runtime','Add official streaming links once live','Decide on bonus package'];
function renderChecklist(id,items,key){document.getElementById(id).innerHTML=`<div class="card"><div class="section-title">${id==='release'?'UnitedMasters Release Prep':'Direct Sale Prep'}</div><div class="checklist">${items.map((x,i)=>`<label class="check"><input type="checkbox" ${state[key][i]?'checked':''} onchange="state.${key}[${i}]=this.checked;save()"><span>${esc(x)}</span></label>`).join('')}</div></div>`}
function renderExport(){const md=buildMarkdown();document.getElementById('export').innerHTML=`<div class="grid"><div class="card span6"><div class="section-title">Export</div><div class="row"><button class="btn" onclick="downloadCSV()">Download CSV</button><button class="btn secondary" onclick="downloadJSON()">Download JSON</button><button class="btn gold" onclick="printPacket()">Create PDF Evidence Packet</button></div><div class="footer-note">PDF generation uses your browser's Print → Save as PDF. No API required.</div></div><div class="card span6"><div class="section-title">Notion Sync</div><div class="muted small">Copy-ready Markdown for now. A direct Notion connection can be added later.</div><textarea id="md" style="width:100%;height:250px;margin-top:10px;background:#09111f;color:white;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(md)}</textarea><button class="btn secondary" style="margin-top:10px" onclick="navigator.clipboard.writeText(document.getElementById('md').value)">Copy Markdown</button></div></div>`}
function renderAll(){document.getElementById('albumLine').textContent=`${state.album.title} · ${state.album.artist} · ${state.tracks.length} tracks`;renderDashboard();renderTracks();renderEvidence();renderChecklist('release',releaseItems,'release');renderChecklist('direct',directItems,'direct');renderExport()}
function u(n,k,v){const t=state.tracks.find(x=>x.number===n);if(t){t[k]=v;save();renderAll()}}
function addTrack(){const n=state.tracks.length?Math.max(...state.tracks.map(t=>t.number))+1:1;state.tracks.push({number:n,title:'New Track',filename:'New Track.mp3',duration:'0:00',instrumental:true,style:'',created:'',version:'',sunoUrl:'',notes:'',canvaShot:'',sunoShot:'',ready:false});save();renderAll()}
function imgUpload(n,k,input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const t=state.tracks.find(x=>x.number===n);t[k]=r.result;save();renderAll()};r.readAsDataURL(file)}
function nextTrack(n){const nums=state.tracks.map(t=>t.number).sort((a,b)=>a-b);let idx=nums.indexOf(n);let target=state.album.backwards?nums[idx-1]:nums[idx+1];if(target){alert(`Next track: #${target} ${state.tracks.find(t=>t.number===target).title}`)}}
function buildMarkdown(){const total=fmt(state.tracks.reduce((a,t)=>a+sec(t.duration),0));return `# ${state.album.title}\n\nArtist: ${state.album.artist}\nDistributor: ${state.album.distributor}\nTheme: ${state.album.theme}\nTotal runtime: ${total}\n\n## Tracklist\n${state.tracks.map(t=>`${t.number}. ${t.title} — ${t.duration}`).join('\n')}\n\n## Documentation note\nThis record is provenance/documentation evidence and is not conclusive proof of copyright ownership.`}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadJSON(){download('trackproof-backup.json',JSON.stringify(state,null,2),'application/json')}
function downloadCSV(){const rows=[['Track Number','Title','Filename','Duration','Created','Version','Suno URL','Style','Canva Evidence','Suno Evidence'],...state.tracks.map(t=>[t.number,t.title,t.filename,t.duration,t.created,t.version,t.sunoUrl,t.style,t.canvaShot?'Yes':'No',t.sunoShot?'Yes':'No'])];download('trackproof-catalog.csv',rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')}
function printPacket(){const w=window.open('','_blank');const total=fmt(state.tracks.reduce((a,t)=>a+sec(t.duration),0));w.document.write(`<html><head><title>${esc(state.album.title)} Evidence Packet</title><style>body{font-family:Arial;padding:36px;color:#111}h1{font-size:34px}h2{margin-top:36px;border-bottom:1px solid #ccc;padding-bottom:6px}.shot{max-width:100%;margin:10px 0;border:1px solid #ddd}.meta{margin:6px 0}.disclaimer{margin-top:30px;font-size:12px;color:#555}</style></head><body><h1>${esc(state.album.title)}</h1><div>${esc(state.album.artist)} · ${state.tracks.length} tracks · ${total}</div><h2>Tracklist</h2><ol>${state.tracks.map(t=>`<li>${esc(t.title)} — ${t.duration}</li>`).join('')}</ol>${state.tracks.map(t=>`<h2>Track ${t.number}: ${esc(t.title)}</h2><div class="meta">Duration: ${t.duration}</div><div class="meta">Created: ${esc(t.created||'Not entered')}</div><div class="meta">Version: ${esc(t.version||'Not entered')}</div><div class="meta">Suno URL: ${esc(t.sunoUrl||'Not entered')}</div><div class="meta">Style: ${esc(t.style||'Not entered')}</div>${t.canvaShot?`<h3>Canva Timeline Evidence</h3><img class="shot" src="${t.canvaShot}">`:''}${t.sunoShot?`<h3>Suno Detail Evidence</h3><img class="shot" src="${t.sunoShot}">`:''}`).join('')}<div class="disclaimer">This packet is documentation/provenance evidence and is not conclusive proof of copyright ownership.</div></body></html>`);w.document.close();setTimeout(()=>w.print(),500)}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
renderAll();
</script>
</body>
</html>
